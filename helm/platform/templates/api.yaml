{{ define "deployment.api" }}
{{- $namespace := include "prefix-product" . }}
{{- $labels := include "labels" . }}
{{- $resources := .Values.resources.api }}
{{- $paused := or .Values.paused (and .Values.colour (ne .Values.colour .Values.prodColour) (not .Values.stagingEnabled)) }}
---
# ServiceAccount for {{ $namespace }} API.
# Kubernetes API access is disabled; the API does not need it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $namespace }}-api
  namespace: {{ $namespace }}
  labels:
    app: api
    {{- $labels | nindent 4 }}
automountServiceAccountToken: false


---
# NetworkPolicy for {{ $namespace }} API.
# Allows egress to ClickHouse, OpenSearch, and DNS only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $namespace }}-api-egress
  namespace: {{ $namespace }}
  labels:
    app: api
    {{- $labels | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
    - Egress
  egress:
    - to: []
      ports:
        - protocol: TCP
          port: {{ include "ports.clickhouse" . }}
    - to: []
      ports:
        - protocol: TCP
          port: {{ include "ports.opensearch" . }}
    - to: []
      ports:
        - protocol: UDP
          port: {{ include "ports.dns" . }}
    - to: []
      ports:
        - protocol: TCP
          port: {{ include "ports.dns" . }}


---
# NetworkPolicy for {{ $namespace }} API.
# Allows ingress from all sources to the http port (API is browser-called).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $namespace }}-api-ingress
  namespace: {{ $namespace }}
  labels:
    app: api
    {{- $labels | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              role: router
      ports:
        - protocol: TCP
          port: {{ include "ports.http" . }}


---
# NetworkPolicy for {{ $namespace }} API metrics.
# Allows ingress from Prometheus pods..
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $namespace }}-api-metrics-ingress
  namespace: {{ $namespace }}
  labels:
    app: api
    {{- $labels | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: {{ include "ports.api.metrics" . }}


{{- if not $paused }}
---
# HorizontalPodAutoscaler for {{ $namespace }} API.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $namespace }}-api-hpa
  namespace: {{ $namespace }}
  labels:
    app: api
    {{- $labels | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $namespace }}-api
  minReplicas: {{ $resources.minReplicas }}
  maxReplicas: {{ $resources.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60


---
# PodDisruptionBudget for {{ $namespace }} API.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $namespace }}-api-pdb
  namespace: {{ $namespace }}
  labels:
    app: api
    {{- $labels | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api
{{- end }}

---
# API Deployment for {{ $namespace }}.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $namespace }}-api
  namespace: {{ $namespace }}
  labels:
    app: api
    {{- $labels | nindent 4 }}
spec:
  {{- if $paused }}
  replicas: 0
  {{- end }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        {{- $labels | nindent 8 }}
    spec:
      serviceAccountName: {{ $namespace }}-api
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.gcp.enabled }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: pool
                    operator: In
                    values:
                      - production
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  product: {{ .Values.product }}
                  app: api
              topologyKey: kubernetes.io/hostname
      {{- end }}
      containers:
        - name: api
          image: {{ .Values.api.image }}
          ports:
            - containerPort: {{ include "ports.http" . }}
              name: api
            - containerPort: {{ include "ports.api.metrics" . }}
              name: metrics
          env:
            - name: PLATFORM_API_CLICKHOUSE_URL
              value: http://{{ $namespace }}-clickhouse.{{ $namespace }}.svc.cluster.local:{{ include "ports.clickhouse" . }}
            - name: PLATFORM_API_OPENSEARCH_URL
              value: http://{{ $namespace }}-opensearch.{{ $namespace }}.svc.cluster.local:{{ include "ports.opensearch" . }}
            # Quoted so the API's config loader keeps it a string rather than parsing 26.09 as a number.
            - name: PLATFORM_API_DATA_RELEASE
              value: {{ printf "%q" .Values.release | quote }}
          resources:
            requests:
              memory: {{ $resources.requests.memory }}
              cpu: {{ $resources.requests.cpu }}
            limits:
              memory: {{ $resources.limits.memory }}
              cpu: {{ $resources.limits.cpu }}
          startupProbe:
            httpGet:
              path: {{ include "paths.health.api" . }}
              port: api
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ include "paths.health.api" . }}
              port: api
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ include "paths.health.api" . }}
              port: api
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
{{- end }}

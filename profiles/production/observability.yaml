# Environment-specific overrides for the observability stack.
#
# This file is passed to Helm by ArgoCD as `valueFiles` and therefore overrides the
# shared base layer in `helm/observability/values.yaml`. Everything that is the
# same for every environment belongs in that base layer instead.

global:
  # Cluster label attached to the logs shipped by Alloy.
  cluster: production
  # Cluster label attached to the node logs read directly from the syslog file.
  nodeLogsCluster: production

loki:
  loki:
    storage_config:
      gcs:
        bucket_name: production-loki-gcp-chunks
    ruler:
      gcs_storage_config:
        bucketnames: production-loki-gcp-ruler
    storage:
      bucketNames:
        chunks: production-loki-gcp-chunks
        ruler: production-loki-gcp-ruler
  serviceAccount:
    annotations:
      iam.gke.io/gcp-service-account: production-node@open-targets-prod.iam.gserviceaccount.com

alloy:
  serviceAccount:
    annotations:
      iam.gke.io/gcp-service-account: production-node@open-targets-prod.iam.gserviceaccount.com

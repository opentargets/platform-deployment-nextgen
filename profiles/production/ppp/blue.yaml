# Values match the legacy production-ppp release's blue colour as deployed on
# 2026-10-14 (main, profiles/production-ppp.yaml). Keep them in step until cutover.
gcpProject: open-targets-prod
prefix: production-blue
product: ppp
domain: opentargets.org
dnsZone: opentargets-org

googleTagManagerId: GTM-5BSVCXB

gcp:
  enabled: true
  ingress: false
  computeClasses: true

release: '26.09'
webapp:
  image: europe-west1-docker.pkg.dev/open-targets-eu-dev/platform-webapp/platform-webapp:26.9.8
api:
  image: europe-west1-docker.pkg.dev/open-targets-eu-dev/platform-api/platform-api:26.9.1
aiapi:
  image: europe-west1-docker.pkg.dev/open-targets-eu-dev/ot-ai-api/ot-ai-api:0.0.13
  gcpServiceAccount: production-ppp-aiapi
  secrets:
    openai: projects/open-targets-prod/locations/europe-west1/secrets/openai-token
clickhouse:
  image: clickhouse/clickhouse-server:26.8.2.7
  snapshot: projects/open-targets-eu-dev/global/snapshots/ppp-2609-ch
opensearch:
  image: opensearchproject/opensearch:3.5.0
  snapshot: projects/open-targets-eu-dev/global/snapshots/ppp-2609-os

resources:
  webapp:
    minReplicas: 2
    maxReplicas: 5
    requests:
      memory: 32Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 500m
  api:
    minReplicas: 2
    maxReplicas: 5
    requests:
      memory: 4Gi
      cpu: 1000m
    limits:
      memory: 4Gi
      cpu: 2000m
  aiapi:
    minReplicas: 2
    maxReplicas: 5
    requests:
      memory: 72Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 500m
  clickhouse:
    replicas: 2
    storageSize: 170Gi
    requests:
      memory: 2Gi
      cpu: 500m
    limits:
      memory: 10Gi
      cpu: 2000m
  opensearch:
    replicas: 2
    storageSize: 60Gi
    heapSize: 3g
    requests:
      memory: 4Gi
      cpu: 500m
    limits:
      memory: 6Gi
      cpu: 2000m

security:
  rateLimiterWhitelist: []
  blacklist: []

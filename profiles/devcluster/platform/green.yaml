gcpProject: open-targets-eu-dev
prefix: devcluster-green
product: platform
domain: opentargets.xyz
dnsZone: opentargets-xyz

googleTagManagerId: GTM-XXXXXXX

gcp:
  enabled: true
  ingress: false

release: '26.09'
webapp:
  image: europe-west1-docker.pkg.dev/open-targets-eu-dev/platform-webapp/platform-webapp:26.9.1
api:
  image: europe-west1-docker.pkg.dev/open-targets-eu-dev/platform-api/platform-api:26.9.0
aiapi:
  image: europe-west1-docker.pkg.dev/open-targets-eu-dev/ot-ai-api/ot-ai-api:0.0.13
  gcpServiceAccount: devcluster-platform-aiapi
  secrets:
    openai: projects/open-targets-eu-dev/locations/europe-west1/secrets/openai-token
clickhouse:
  image: clickhouse/clickhouse-server:26.8.2.7
  snapshot: projects/open-targets-eu-dev/global/snapshots/platform-2609b-ch
opensearch:
  image: opensearchproject/opensearch:3.5.0
  snapshot: projects/open-targets-eu-dev/global/snapshots/platform-2609-os

resources:
  webapp:
    minReplicas: 1
    maxReplicas: 5
    requests:
      memory: 32Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 500m
  api:
    minReplicas: 1
    maxReplicas: 5
    requests:
      memory: 4Gi
      cpu: 1000m
    limits:
      memory: 20Gi
      cpu: 7500m
  aiapi:
    minReplicas: 1
    maxReplicas: 5
    requests:
      memory: 72Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 500m
  clickhouse:
    replicas: 1
    storageSize: 150Gi
    requests:
      memory: 2Gi
      cpu: 1000m
    limits:
      memory: 10Gi
      cpu: 4000m
  opensearch:
    replicas: 1
    storageSize: 60Gi
    heapSize: 8g
    requests:
      memory: 4Gi
      cpu: 1000m
    limits:
      memory: 16Gi
      cpu: 4000m

security:
  rateLimiterWhitelist: []
  blacklist: []

# Environment-specific overrides for the observability stack.
#
# This file is passed to Helm by ArgoCD as `valueFiles` and therefore overrides the
# shared base layer in `helm/observability/values.yaml`. Everything that is the
# same for every environment belongs in that base layer instead.

global:
  # Cluster label attached to the logs shipped by Alloy.
  cluster: devcluster
  # Cluster label attached to the node logs read directly from the syslog file.
  nodeLogsCluster: dev_cluster

loki:
  loki:
    storage_config:
      gcs:
        bucket_name: devcluster-loki-gcp-chunks
    ruler:
      gcs_storage_config:
        bucketnames: devcluster-loki-gcp-ruler
    storage:
      bucketNames:
        chunks: devcluster-loki-gcp-chunks
        ruler: devcluster-loki-gcp-ruler
  serviceAccount:
    annotations:
      iam.gke.io/gcp-service-account: devcluster-node@open-targets-eu-dev.iam.gserviceaccount.com

alloy:
  serviceAccount:
    annotations:
      iam.gke.io/gcp-service-account: devcluster-node@open-targets-eu-dev.iam.gserviceaccount.com

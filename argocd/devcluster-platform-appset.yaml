apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: devcluster-platform
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - colour: blue
                - colour: green
          # Reads prodColour/stagingEnabled from the router profile so both
          # colours automatically know whether they're prod or idle staging.
          - git:
              repoURL: https://github.com/opentargets/platform-deployment-nextgen.git
              revision: argocd-nginx-router
              files:
                - path: profiles/devcluster-router.yaml
  template:
    metadata:
      name: devcluster-platform-{{ .colour }}
      labels:
        role: "{{ if eq .colour .prodColour }}prod{{ else }}staging{{ end }}"
    spec:
      project: default
      source:
        repoURL: https://github.com/opentargets/platform-deployment-nextgen.git
        targetRevision: argocd-nginx-router
        path: helm/platform
        helm:
          valueFiles:
            - /profiles/devcluster-{{ .colour }}.yaml
          parameters:
            - name: colour
              value: "{{ .colour }}"
            - name: prodColour
              value: "{{ .prodColour }}"
            - name: stagingEnabled
              value: "{{ .stagingEnabled }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: devcluster-{{ .colour }}-platform
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

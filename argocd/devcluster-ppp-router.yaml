apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devcluster-ppp-router
  namespace: argocd
spec:
  project: default
  # The private repo supplies values that can't be public (rate-limited User-Agents);
  # ArgoCD reads it with the deploy-key repository Secret (see docs/private-values.md).
  sources:
    - repoURL: https://github.com/opentargets/platform-deployment-nextgen.git
      targetRevision: main
      path: helm/router
      helm:
        valueFiles:
          - /profiles/devcluster/ppp/router.yaml
          - $private/user-agents.yaml
    - repoURL: git@github.com:opentargets/platform-access-control.git
      targetRevision: main
      ref: private
  destination:
    server: https://kubernetes.default.svc
    namespace: devcluster-ppp-router
  # GKE's managed-certificate controller writes the router's certificates into this
  # annotation. The chart doesn't set it, so ignore it, and keep the live value on sync
  # (RespectIgnoreDifferences) rather than stripping it from the load balancer.
  ignoreDifferences:
    - group: networking.k8s.io
      kind: Ingress
      jsonPointers:
        - /metadata/annotations/ingress.gcp.kubernetes.io~1pre-shared-cert
  # Manual sync during the migration window — restore automated{prune,selfHeal} after.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true

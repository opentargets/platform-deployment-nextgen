apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devcluster-platform-router
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/opentargets/platform-deployment-nextgen.git
    targetRevision: argocd-rebase-observability
    path: helm/router
    helm:
      valueFiles:
        - /profiles/devcluster/platform/router.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: devcluster-platform-router
  # Manual sync during the migration window — restore automated{prune,selfHeal} once
  # DNS has been cut over and the legacy release is retired.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      # Detect another ArgoCD Application's ownership (not Helm ownership).
      - FailOnSharedResource=true
